<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Nexus Workflow Visualizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!--suppress HtmlUnknownTarget -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://unpkg.com/cytoscape@3.28.1/dist/cytoscape.min.js"></script>
    <script type="module">
        import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs';

        mermaid.initialize({startOnLoad: false, theme: 'base', themeVariables: {fontFamily: 'IBM Plex Sans, system-ui, sans-serif', primaryColor: '#edf5f7', primaryTextColor: '#131416', primaryBorderColor: '#1b6c80', lineColor: '#929da3', secondaryColor: '#f4f6f8', tertiaryColor: '#ffffff'}});
        window.nexusMermaid = mermaid;
    </script>
    <style>

        :root {
            color-scheme: light;
            --ground: #f9fbfc; --surface: #fff; --raised: #f4f6f8; --border: #e8eaec;
            --ink: #131416; --muted: #5d5f60; --accent: #1b6c80;
            font: 400 14px/1.5 "IBM Plex Sans", system-ui, sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--ground); color: var(--ink); height: 100dvh; display: flex; flex-direction: column; padding: 0 8px 8px; }
        header { min-height: 56px; padding: 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; }
        .mark { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 6px; background: var(--accent); color: white; }
        header h1 { font-size: 14px; font-weight: 400; color: var(--muted); }
        header h1::before { content: "/"; color: #a2a9ad; margin-right: 10px; }
        .connection { margin-left: auto; display: flex; align-items: center; gap: 7px; }
        #status-dot { width: 7px; height: 7px; border-radius: 50%; background: #c4242a; flex-shrink: 0; }
        #status-text { font-size: 12px; color: var(--muted); }
        #workflow-summary-badge { background: #edf5f7; color: var(--accent); padding: 10px 20px; border-radius: 8px; margin-bottom: 8px; }
        #tabs { display: flex; gap: 20px; padding: 0 24px; background: var(--surface); border: 1px solid var(--border); border-bottom: 0; border-radius: 12px 12px 0 0; }
        button { font: inherit; cursor: pointer; border: 1px solid #cdced1; border-radius: 6px; padding: 7px 14px; background: var(--surface); color: var(--ink); transition: background .15s, border-color .15s; }
        button:hover { background: var(--raised); border-color: #929da3; }
        :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
        .tab { padding: 17px 0; font-size: 13px; color: var(--muted); border: 0; border-bottom: 2px solid transparent; border-radius: 0; }
        .tab:hover { background: transparent; color: var(--ink); }
        .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 500; }
        #main { display: flex; flex: 1; min-height: 0; overflow: hidden; position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 0 0 12px 12px; }
        #cy, #mermaid-container { flex: 1; min-width: 0; background-color: var(--surface); background-image: radial-gradient(#dce2e5 .8px, transparent .8px); background-size: 22px 22px; }
        #mermaid-container { display: none; overflow: auto; padding: 24px; }
        #mermaid-view { width: 100%; min-height: 100%; display: flex; align-items: center; justify-content: center; }
        #mermaid-view svg { max-width: 100%; }
        #sidebar { width: 320px; background: var(--surface); border-left: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
        #sidebar h2 { padding: 20px; font-size: 14px; font-weight: 500; border-bottom: 1px solid var(--border); }
        #sidebar h2 span { display: block; font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 4px; }
        #event-log { flex: 1; overflow-y: auto; padding: 12px; min-height: 0; }
        #event-log:empty::before { content: "Workflow activity will appear here as agents run."; display: block; padding: 12px 8px; font-size: 13px; color: var(--muted); line-height: 1.7; }
        .event-item { padding: 12px; margin: 0 0 10px; border-radius: 6px; font: 11px/1.7 "IBM Plex Mono", ui-monospace, monospace; border: 1px solid var(--border); border-left: 3px solid var(--accent); background: var(--raised); }
        #controls { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
        #controls button { flex: 1; font-size: 12px; }
        #controls button:first-child { background: #1d1f20; border-color: #1d1f20; color: #fff; }
        #controls button:first-child:hover { background: #35393b; }
        @media (max-width: 700px) {
            header { gap: 8px; } header h1 { font-size: 12px; } .connection { width: 100%; margin-left: 32px; }
            #tabs { padding: 0 16px; gap: 20px; } .tab { padding: 13px 0; }
            #main { flex-direction: column; } #cy, #mermaid-container { min-height: 240px; }
            #sidebar { width: 100%; height: 32%; min-height: 150px; border-left: 0; border-top: 1px solid var(--border); }
            #sidebar h2 { padding: 10px 16px; } #sidebar h2 span { display: none; }
            #controls { padding: 8px 16px; } #event-log { padding: 8px 12px; }
        }
        @media (prefers-reduced-motion: reduce) { button { transition: none; } }
    </style>
</head>
<body>
<header>
    <div class="brand"><svg class="mark" viewBox="0 0 20 20" aria-hidden="true"><circle cx="6.5" cy="13.5" r="2.4" fill="#fff"/><circle cx="13.5" cy="6.5" r="2.4" fill="#fff"/><path d="M8.2 11.8 11.8 8.2" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/></svg>Nexus</div>
    <h1>Workflow visualizer</h1>
    <div class="connection" role="status"><div id="status-dot" aria-hidden="true"></div><span id="status-text">Connecting…</span></div>
</header>
<div id="workflow-summary-badge"
     role="status" style="display:none;"></div>
<div id="tabs" role="group" aria-label="Workflow view">
    <button class="tab active" aria-pressed="true" onclick="showTab('graph')">Network graph</button>
    <button class="tab" aria-pressed="false" onclick="showTab('mermaid')">Workflow diagram</button>
</div>
<div id="main">
    <div id="cy"></div>
    <div id="mermaid-container">
        <div id="mermaid-view"></div>
    </div>
    <div id="sidebar">
        <h2>Live events<span>Follow each step as it happens.</span></h2>
        <div id="event-log"></div>
        <div id="controls">
            <button onclick="if (cy) cy.fit()">Fit to view</button>
            <button onclick="clearGraph()">Clear</button>
        </div>
    </div>
</div>
<script>
    // ---- Graph ----
    let cy = null;
    const fallbackRows = new Map();
    let lastMermaidDiagram = '';
    let mermaidRenderSeq = 0;
    const cyContainer = document.getElementById('cy');
    const eventColors = {
        agent_registered: '#1e7b4f',
        workflow_mapped: '#986b14',
        step_status_changed: '#1b6c80',
        workflow_completed: '#986b14',
        mermaid_diagram: '#5d5f60',
    };

    function setConnectionStatus(isConnected) {
        const dot = document.getElementById('status-dot');
        const text = document.getElementById('status-text');
        dot.style.background = isConnected ? '#1e7b4f' : '#c4242a';
        text.textContent = isConnected ? 'Connected' : 'Disconnected - reconnecting...';
    }

    if (typeof window.cytoscape === 'function') {
        cy = window.cytoscape({
            container: cyContainer,
            style: [
                {
                    selector: 'node', style: {
                        'background-color': '#ffffff',
                        'border-color': '#1b6c80',
                        'border-width': 2,
                        'color': '#131416',
                        'label': 'data(label)',
                        'text-valign': 'center',
                        'text-halign': 'center',
                        'font-size': '12px',
                        'font-family': 'IBM Plex Sans, system-ui, sans-serif',
                        'width': 100, 'height': 40,
                        'shape': 'round-rectangle',
                        'text-wrap': 'wrap',
                        'text-max-width': '90px',
                    }
                },
                {
                    selector: 'node.workflow',
                    style: {'background-color': '#edf7f0', 'border-color': '#1e7b4f', 'border-width': 2}
                },
                {selector: 'node.agent', style: {'background-color': '#edf5f7', 'border-color': '#1b6c80'}},
                {selector: 'node.running', style: {'border-color': '#1b6c80', 'border-width': 3}},
                {selector: 'node.done', style: {'border-color': '#1e7b4f', 'border-width': 3}},
                {selector: 'node.failed', style: {'border-color': '#c4242a', 'border-width': 3}},
                {selector: 'node.skipped', style: {'border-color': '#986b14', 'border-width': 2}},
                {selector: 'node.pending', style: {'border-color': '#5d5f60', 'border-width': 2}},
                {
                    selector: 'edge', style: {
                        'width': 2,
                        'line-color': '#d5dde1',
                        'target-arrow-color': '#d5dde1',
                        'target-arrow-shape': 'triangle',
                        'curve-style': 'bezier',
                        'label': 'data(label)',
                        'font-size': '9px',
                        'color': '#5d5f60',
                        'text-background-color': '#ffffff',
                        'text-background-opacity': 1,
                        'text-background-padding': '2px',
                    }
                },
            ],
            layout: {name: 'cose', padding: 30},
            elements: [],
        });
    } else {
        cyContainer.innerHTML = '<div style="padding:16px;color:#5d5f60;font-size:14px;">Graph library unavailable; showing workflow list fallback.</div>';
    }

    function ensureNode(id, label, cls) {
        if (!cy) return;
        if (!cy.getElementById(id).length) {
            cy.add({data: {id, label}, classes: cls});
            relayout();
        }
    }

    function ensureEdge(source, target, label) {
        if (!cy) return;
        const eid = `${source}->${target}`;
        if (!cy.getElementById(eid).length) {
            cy.add({data: {id: eid, source, target, label}});
            relayout();
        }
    }

    let layoutTimer = null;

    function relayout() {
        if (!cy) return;
        clearTimeout(layoutTimer);
        layoutTimer = setTimeout(() => {
            cy.layout({name: 'cose', animate: true, animationDuration: 400, padding: 30}).run();
        }, 300);
    }

    function clearGraph() {
        if (cy) {
            cy.elements().remove();
        }
        fallbackRows.clear();
        if (cyContainer) {
            cyContainer.innerHTML = '';
        }
    }

    function renderFallbackList() {
        if (cy || !cyContainer) return;
        const rows = Array.from(fallbackRows.values());
        if (!rows.length) {
            cyContainer.innerHTML = '<div style="padding:16px;color:#5d5f60;font-size:14px;">No active workflows in snapshot.</div>';
            return;
        }

        cyContainer.innerHTML = rows.map((row) => (
            `<div style="margin:10px;padding:10px;border:1px solid #d5dde1;border-radius:6px;background:#f4f6f8;">`
            + `<div style="font-weight:600;">Issue #${row.issue}</div>`
            + `<div style="color:#5d5f60;font-size:12px;">Workflow: ${row.workflowId}</div>`
            + `<div style="color:#5d5f60;font-size:12px;">State: ${row.state || 'unknown'}</div>`
            + `<div style="color:#5d5f60;font-size:12px;">Agent: ${row.agent || 'n/a'}</div>`
            + `</div>`
        )).join('');
    }

    function applyWorkflowSnapshot(items) {
        if (!Array.isArray(items)) return;
        let snapshotDiagram = '';
        let snapshotDiagramUpdatedAt = '';
        for (const item of items) {
            const issue = String(item.issue || '').trim();
            const workflowId = String(item.workflow_id || '').trim();
            const status = item.status || {};
            if (!issue || !workflowId) continue;

            const issueId = `issue-${issue}`;
            const wfId = `wf-${workflowId}`;

            fallbackRows.set(issue, {
                issue,
                workflowId,
                state: String(status.state || ''),
                agent: String(status.current_agent || ''),
            });

            ensureNode(issueId, `Issue #${issue}`, 'workflow');
            ensureNode(wfId, workflowId, 'workflow');
            ensureEdge(issueId, wfId, String(status.state || 'mapped'));

            const currentAgent = String(status.current_agent || '').trim();
            if (currentAgent && currentAgent.toLowerCase() !== 'unknown') {
                const agentId = `agent-${issue}-${currentAgent}`;
                ensureNode(agentId, currentAgent, 'agent');
                ensureEdge(wfId, agentId, String(status.current_step_name || 'current'));
            }

            const candidateDiagram = String(item.diagram || '').trim();
            const candidateUpdatedAt = String(status.updated_at || '').trim();
            if (candidateDiagram) {
                if (!snapshotDiagram || candidateUpdatedAt > snapshotDiagramUpdatedAt) {
                    snapshotDiagram = candidateDiagram;
                    snapshotDiagramUpdatedAt = candidateUpdatedAt;
                }
            }
        }

        if (cy) {
            cy.fit(undefined, 40);
        } else {
            renderFallbackList();
        }

        if (!lastMermaidDiagram && snapshotDiagram) {
            renderMermaidDiagram(snapshotDiagram);
        }
    }

    async function renderMermaidDiagram(diagram) {
        const normalized = String(diagram || '').trim();
        if (!normalized) return;
        lastMermaidDiagram = normalized;
        const seq = ++mermaidRenderSeq;
        try {
            if (!window.nexusMermaid) return;
            const {svg} = await window.nexusMermaid.render(`mermaid-svg-${seq}`, normalized);
            // Avoid racing older async renders over newer ones.
            if (seq !== mermaidRenderSeq) return;
            document.getElementById('mermaid-view').innerHTML = svg;
        } catch (err) {
            console.error('Mermaid render error:', err);
        }
    }

    async function refreshSnapshot() {
        try {
            const response = await fetch('/visualizer/snapshot', {cache: 'no-store'});
            if (!response.ok) return;
            const payload = await response.json();
            applyWorkflowSnapshot(payload.workflows || []);
        } catch (_) {
            // Silent fallback: visualizer can still run via live socket events.
        }
    }

    function showTab(tab) {
        const cyEl = document.getElementById('cy');
        const mermaidEl = document.getElementById('mermaid-container');
        const tabs = document.querySelectorAll('.tab');

        tabs.forEach(t => { t.classList.remove('active'); t.setAttribute('aria-pressed', 'false'); });

        if (tab === 'graph') {
            cyEl.style.display = 'block';
            mermaidEl.style.display = 'none';
            tabs[0].classList.add('active');
            tabs[0].setAttribute('aria-pressed', 'true');
            if (cy) cy.resize();
            relayout();
        } else {
            cyEl.style.display = 'none';
            mermaidEl.style.display = 'block';
            tabs[1].classList.add('active');
            tabs[1].setAttribute('aria-pressed', 'true');
        }
    }

    // ---- Event log ----
    function logEvent(type, data) {
        const log = document.getElementById('event-log');
        const item = document.createElement('div');
        item.className = 'event-item';
        item.style.borderLeftColor = eventColors[type] || '#1b6c80';

        const time = new Date().toLocaleTimeString();
        const timeLine = document.createElement('div');
        timeLine.style.fontSize = '0.7rem';
        timeLine.style.color = '#5d5f60';
        timeLine.style.marginBottom = '3px';
        timeLine.innerHTML = `${time} - <strong>${type}</strong>`;

        const body = document.createElement('div');
        body.style.color = '#131416';
        body.style.wordBreak = 'break-word';
        body.textContent = JSON.stringify(data);

        item.append(timeLine, body);
        log.prepend(item);
        // Cap log to 100 items
        while (log.children.length > 100) log.removeChild(log.lastChild);
    }

    // ---- SocketIO ----
    if (typeof window.io === 'function') {
        const socket = window.io('/visualizer');

        socket.on('connect', () => {
            setConnectionStatus(true);
        });

        socket.on('disconnect', () => {
            setConnectionStatus(false);
        });

        socket.on('agent_registered', (data) => {
            logEvent('agent_registered', data);
            const issueId = `issue-${data.issue}`;
            const agentId = `agent-${data.issue}-${data.agent}`;
            ensureNode(issueId, `Issue #${data.issue}`, 'workflow');
            ensureNode(agentId, data.agent, 'agent');
            ensureEdge(issueId, agentId, 'launched');
        });

        socket.on('workflow_mapped', (data) => {
            logEvent('workflow_mapped', data);
            const issueId = `issue-${data.issue}`;
            const wfId = `wf-${data.workflow_id}`;
            ensureNode(issueId, `Issue #${data.issue}`, 'workflow');
            ensureNode(wfId, data.workflow_id, 'workflow');
            ensureEdge(issueId, wfId, 'workflow');
        });

        socket.on('step_status_changed', (data) => {
            logEvent('step_status_changed', data);
            const agentId = `agent-${data.issue}-${data.agent_type}`;
            ensureNode(agentId, data.agent_type, 'agent');

            if (!cy) return;
            const node = cy.getElementById(agentId);
            node.removeClass('running done failed skipped pending');
            node.addClass(data.status);
        });

        socket.on('workflow_completed', (data) => {
            logEvent('workflow_completed', data);
            const wfId = `wf-${data.workflow_id}`;
            if (cy) {
                const node = cy.getElementById(wfId);
                if (node.length) {
                    node.style('border-color', data.status === 'success' ? '#1e7b4f' : '#c4242a');
                    node.data('label', data.summary || `Workflow ${data.status}`);
                }
            }
            if (data.summary) {
                const badge = document.getElementById('workflow-summary-badge');
                if (badge) {
                    badge.textContent = data.summary;
                    badge.style.color = data.status === 'success' ? '#1e7b4f' : '#c4242a';
                    badge.style.display = 'block';
                }
            }
        });

        socket.on('mermaid_diagram', async (data) => {
            logEvent('mermaid_diagram', {issue: data.issue, diagram: '...'});
            renderMermaidDiagram(data.diagram);
        });
    } else {
        document.getElementById('status-text').textContent = 'Live socket unavailable - using snapshot mode';
    }

    refreshSnapshot();
    setInterval(refreshSnapshot, 15000);
</script>
</body>
</html>
