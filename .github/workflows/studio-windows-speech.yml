name: Studio Windows speech acceptance

on:
  push:
    branches:
      - 'codex/windows-speech-*'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/studio-windows-speech.yml'
      - 'nexus/core/studio_speech*.py'
      - 'nexus/core/studio.py'
      - 'nexus/core/studio_desktop_sidecar.py'
      - 'nexus/core/studio_desktop_bundle.py'
      - 'examples/nexus-bot/src/studio_windows_speech_lifecycle.py'
      - 'tests/test_studio_speech_windows.py'
      - 'tests/test_studio_speech_worker.py'
      - 'tests/test_studio_speech_service_lifecycle.py'
      - 'tests/studio_windows_speech_acceptance.py'
      - 'tests/test_studio_windows_acceptance_runner.py'
      - 'examples/nexus-bot/src/studio_local_speech.py'
      - 'tests/studio_local_speech_acceptance.py'
      - 'tests/fixtures/studio_voice_models.py'
      - 'tests/test_studio_voice_model_preparation.py'
      - 'examples/nexus-bot/src/studio_real_speech_interruption.py'
      - 'tests/fixtures/studio_voice_interrupt_worker.py'
      - 'tests/studio_windows_real_speech_interruption_acceptance.py'
      - 'tests/test_studio_voice_interruption_hooks.py'
      - 'pyproject.toml'

permissions:
  contents: read

jobs:
  native-speech:
    name: Windows x64 / Python ${{ matrix.python }}
    runs-on: windows-2022
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    env:
      PYTHONPATH: '.'
      PYTHONUTF8: '1'
    steps:
      - name: Check out source without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          architecture: x64
      - name: Install framework and test runner
        run: python -m pip install --editable . pytest pytest-asyncio
      - name: Check portable ownership guards
        run: >-
          python -m pytest -o addopts=''
          tests/test_studio_speech_windows.py tests/test_studio_speech_worker.py
          tests/test_studio_windows_acceptance_runner.py
          tests/test_studio_speech_service_lifecycle.py
          --junitxml=acceptance-results/portable.xml -q
      - name: Exercise actual Windows process ownership
        if: ${{ !cancelled() && success() }}
        run: >-
          python tests/studio_windows_speech_acceptance.py
          --report acceptance-results/native-windows.json
      - name: Retain evidence even when checks fail
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: studio-windows-speech-py${{ matrix.python }}
          path: acceptance-results/
          if-no-files-found: warn
          retention-days: 14

  real-models:
    name: Windows x64 / real Piper and Whisper
    needs: native-speech
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      PYTHONPATH: '.'
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Install CPU speech runtimes in the disposable runner
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.14.1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --editable . pytest pytest-asyncio "openai-whisper==20250625" "piper-tts==1.8.0"
      - name: Prepare FFmpeg in the disposable Windows runner
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg --yes --no-progress --limit-output
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) { throw "FFmpeg preparation failed" }
          ffmpeg -version
      - name: Prepare approved model snapshots with exact hash verification
        run: python tests/fixtures/studio_voice_models.py --directory "${{ runner.temp }}/nexus-voice-models"
      - name: Exercise actual local speech through Studio jobs
        env:
          NEXUS_ACCEPTANCE_WHISPER_MODEL: '${{ runner.temp }}/nexus-voice-models/tiny.en.pt'
          NEXUS_ACCEPTANCE_PIPER_MODEL: '${{ runner.temp }}/nexus-voice-models/en_US-lessac-medium.onnx'
        run: >-
          python -m pytest -o addopts=''
          tests/studio_local_speech_acceptance.py
          tests/studio_windows_real_speech_interruption_acceptance.py
          --junitxml=acceptance-results/real-models.xml -q
      - name: Retain test evidence without redistributing models
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: studio-windows-real-models
          path: acceptance-results/
          if-no-files-found: warn
          retention-days: 14
