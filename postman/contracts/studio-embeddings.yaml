openapi: 3.0.3
info:
  title: Nexus embedding-adapter compatibility subset
  version: 1.0.0
  description: Local verification contract derived from the existing Nexus adapter. This is not a vendor certification.
paths:
  /v1/embeddings:
    post:
      operationId: embedTexts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, input]
              properties:
                model: {type: string}
                input:
                  type: array
                  minItems: 1
                  maxItems: 257
                  items: {type: string}
      responses:
        '200':
          description: One indexed finite vector per input, in any response order
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [index, embedding]
                      properties:
                        index: {type: integer, minimum: 0}
                        embedding:
                          type: array
                          minItems: 1
                          maxItems: 8192
                          items: {type: number}
        '401': {description: Missing or rejected provider credentials}
        '503': {description: Selected service temporarily unavailable}
