openapi: 3.0.3
info:
  title: Nexus Studio external configuration conversion
  version: 1.7.0
  description: Non-executing owner-only conversion. Imports use existing native validate/plan/apply after review; no external deployment or secret expansion. Declarative agent skills map to routing capabilities, distinct from additionalConfigurations.skills knowledge bundles. Missing capability IDs get stable content-derived local IDs; original source remains unchanged on export. Dedicated toolsets require explicit existing-resource bindings. Transport modes and execution permissions are never expanded by descriptive metadata. One exit-handler template may serve multiple outcome phases; always runs first, followed by the matching outcome phase, each with its own durable checkpoint. Existing distinct-handler checkpoint paths remain unchanged. Shared loop templates require dependency-ordered controllers; each controller pins its initial previous value and keeps isolated iteration receipts. Later controllers inherit the preceding body output. Concurrent shared loops and mixed map/loop ownership reject before saving.
paths:
  /api/studio/configuration/interop/convert:
    post:
      operationId: convertSAMConfiguration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                text: {type: string, maxLength: 1048576}
                documents: {type: array, maxItems: 100, items: {type: object}}
                bindings: {$ref: '#/components/schemas/Bindings'}
              description: Supply text or documents, exactly one. Text accepts bounded multi-document YAML/JSON or a nexus-interop-bundle/v1 export. Bind every agent/model alias to an explicit Nexus provider; tool names require explicit bindings.
      responses:
        '200':
          description: Conversion report, valid false on unsupported constructs; document is null on any diagnostic. Supports bounded map/loop/switch, when, coalesce/concat, deterministic conditions, bounded OnError/OnFailure/Always retries for generation-only API agents, and success/failure/always/cancellation exit handlers in interop-template/v1; typed text decisions with explicit decision bindings, choice/boolean/score answers, direct/default/escalation/reroute behavior; image decisions are unsupported; unsupported syntax/settings reject the whole document. No state writes or provider/tool calls.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Report'}
        '403': {description: Workspace owner required}
        '400': {description: Invalid request envelope or size}
  /api/studio/configuration/interop/export:
    post:
      operationId: exportSAMConfiguration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                document: {type: object}
              description: Optional native nexus-studio-config/v1 document; omitted exports current workspace. Unsupported resources/fields produce diagnostics without a partial bundle.
      responses:
        '200':
          description: Report with valid, diagnostics and bundle. Successful bundle contains external declarative documents and explicit Nexus provider/tool bindings, never credentials.
        '403': {description: Workspace owner required}
components:
  schemas:
    Bindings:
      type: object
      additionalProperties: false
      properties:
        models: {type: object, additionalProperties: {$ref: '#/components/schemas/Provider'}}
        agents: {type: object, additionalProperties: {$ref: '#/components/schemas/Provider'}}
        tools: {type: object, additionalProperties: {type: string}}
        decisions: {type: object, additionalProperties: {$ref: '#/components/schemas/DecisionBinding'}}
    DecisionBinding:
      type: object
      additionalProperties: false
      required: [backend, model]
      properties:
        backend: {type: string, enum: [openrouter, opencode]}
        model: {type: string, maxLength: 200}
    Provider:
      type: object
      additionalProperties: false
      required: [provider]
      properties:
        provider: {type: string, enum: [codex, claude-code, copilot, gemini, opencode, openai, claude]}
        model: {type: string, maxLength: 200}
    Report:
      type: object
      required: [format, valid, diagnostics, document]
      properties:
        format: {type: string, enum: [nexus-interop-conversion/v1]}
        valid: {type: boolean}
        diagnostics:
          type: array
          items:
            type: object
            required: [path, code, message]
            properties:
              path: {type: string}
              code: {type: string}
              message: {type: string}
        document: {type: object, nullable: true}
# Collection routing extension: body switch/decision targets and their dependent
# join nodes compile into a bounded nested graph, preserving first-match routing,
# per-item scope, retries, approvals and checkpoint paths. The collection returns
# its named root body's output. Body-internal references use local node outputs;
# references outside the body capture only acknowledged upstream outputs.
